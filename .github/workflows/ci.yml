name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST。ライブ差分を多めに回し、Go のファズも行う
  workflow_dispatch:

jobs:
  lean:
    name: Lean (proofs, audit, oracle goldens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Proof audit and spec versions
        run: make audit
      - name: Oracle test cases and golden files are up to date
        run: make diff-check

  go:
    name: Go (format, vet, golden differential tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: make test
      - run: make go

  live-diff:
    name: Live differential test (Go vs Lean oracle)
    needs: [lean, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Live differential test
        # 乱数の種は実行ごとに変わる(run_id)。失敗したら、ログの seed で make live-diff SEED=... を再現できる
        run: make live-diff N=${{ github.event_name == 'schedule' && 10000 || 1000 }} SEED=${{ github.run_id }}
      - name: Go fuzzing (nightly)
        if: github.event_name == 'schedule'
        run: make fuzz FUZZTIME=5m
      - name: Upload mismatching inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-failures
          path: |
            testdata/live-failures/
            go/internal/check/testdata/fuzz/
          if-no-files-found: ignore
